<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Pace Planner - Stabilized</title>
<style>
/* 必要なスタイルのみに絞り込み、競合を排除 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{ --bg:#fff; --text:#18180f; --acc:#18180f; --border:rgba(0,0,0,0.1); }
body{ font-family: sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
/* タブコンテンツの制御 */
.tab-content { display: none; }
.tab-content.active { display: block; }
.settings-item { margin-bottom: 15px; padding: 10px; border-bottom: 1px solid var(--border); }
.settings-item label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
.settings-item input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
</style>
</head>
<body class="pc-mode">

<header style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--border);">
  <div style="font-weight:bold;">Ride Planner</div>
  <button onclick="sw('settings')" id="cond-toggle-btn" style="padding:5px 10px;">⚙️ 条件設定</button>
</header>

<main style="display:flex;">
  <div id="map-col" style="flex:1; padding:20px;">
    <div id="route-info" style="font-size:24px; font-weight:bold; margin-bottom:10px;">
      距離: <span id="total-dist">198.9</span> km
    </div>
    <div id="gmap" style="width:100%; height:500px; background:#eee; border-radius:10px; display:flex; align-items:center; justify-content:center;">
      Map Area (Ready to Load)
    </div>
  </div>

  <div id="settings-col" style="width:320px; border-left:1px solid var(--border); height:100vh; overflow-y:auto; padding:10px;">
    <nav style="display:flex; border-bottom:1px solid var(--border); margin-bottom:10px;">
      <button onclick="sw('ride')" style="flex:1; padding:10px;">ライド</button>
      <button onclick="sw('settings')" style="flex:1; padding:10px;">⚙️ 設定</button>
    </nav>

    <section id="sec-settings" class="tab-content">
      <div class="settings-item">
        <label>目標距離 (km)</label>
        <input type="number" id="pref-dist" value="198.9" step="0.1" oninput="updateStats()">
      </div>
      <div class="settings-item">
        <label>体重 (kg)</label>
        <input type="number" id="pref-weight" value="65" oninput="updateStats()">
      </div>
      <div class="settings-item">
        <label>FTP (W)</label>
        <input type="number" id="pref-ftp" value="200" oninput="updateStats()">
      </div>
      <div class="settings-item">
        <label>スタート時刻</label>
        <input type="time" id="pref-start-time" value="06:00" oninput="updateStats()">
      </div>
      <button onclick="alert('設定を保存しました')" style="width:100%; padding:10px; background:#000; color:#fff; border:none; border-radius:5px; cursor:pointer;">
        ライドに適用
      </button>
    </section>

    <section id="sec-ride" class="tab-content active">
      <p>ライドの統計情報がここに表示されます。</p>
    </section>
  </div>
</main>

<script>
// タブ切り替え：エラーの出ようがない極めて単純なロジック
function sw(tabId) {
  // 全てのコンテンツを非表示
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  // 選択したIDだけ表示
  const target = document.getElementById('sec-' + tabId);
  if (target) {
    target.classList.add('active');
  } else {
    console.error('Target section not found: sec-' + tabId);
  }
}

// 数値のリアルタイム連動
function updateStats() {
  const dist = document.getElementById('pref-dist').value;
  document.getElementById('total-dist').textContent = dist;
  // ここに標高計算などのトリガーを連結（既存のロジックがあれば呼び出し）
  console.log('Stats Updated: ', dist, 'km');
}

// ページ読み込み時の初期化
window.onload = function() {
  sw('ride'); // 初期はライドタブ
};
</script>
</body>
</html>
