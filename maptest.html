<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Test</title>
<style>
body{margin:0;padding:10px;font-family:sans-serif}
#map{width:100%;height:400px;background:#eee}
#status{padding:10px;font-size:14px;color:#333}
</style>
</head>
<body>
<div id="status">Loading...</div>
<div id="map"></div>
<script>
function initMap(){
  document.getElementById('status').textContent='✅ Google Maps loaded OK';
  document.getElementById('status').style.color='green';
  new google.maps.Map(document.getElementById('map'),{
    center:{lat:33.59,lng:130.40},
    zoom:11
  });
}
window.onerror=function(msg,src,line){
  document.getElementById('status').textContent='❌ Error: '+msg+' ('+src+':'+line+')';
  document.getElementById('status').style.color='red';
};
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqoHiFUFAJcjAOTHNwdHTAMmAGwRr97Yc&callback=initMap" async defer></script>
</body>
</html>
