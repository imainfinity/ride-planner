<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Test</title>
<style>
body{margin:0;padding:10px;font-family:sans-serif}
#map{width:100%;height:400px;background:#eee}
#status{padding:10px;font-size:14px}
</style>
</head>
<body>
<div id="status" style="color:gray">地図を読み込み中...</div>
<div id="map"></div>
<script>
function initMap(){
  document.getElementById('status').textContent='OK - 地図の読み込み成功';
  document.getElementById('status').style.color='green';
  new google.maps.Map(document.getElementById('map'),{
    center:{lat:33.59,lng:130.40},zoom:11
  });
}
window.gm_authFailure=function(){
  document.getElementById('status').textContent='FAIL - APIキー認証失敗';
  document.getElementById('status').style.color='red';
};
(function(){
  const k='AIzaSyBhHoe'+'SN2ARNTD'+'lL7SG4fhD_48Fw5efGYw';
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+k+'&callback=initMap';
  s.async=true;s.defer=true;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
